<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game of Life Lab</title>
</head>
<body>
  <h1>Game of Life Lab</h1>
  <p>My first cellular automaton project.</p>

  <button id="stepButton">Step</button>
  <button id="runButton">Run</button>
<button id="pauseButton">Pause</button>
<button id="resetButton">Reset</button>
<button id="randomButton">Random</button>

<label for="densitySlider">Density:</label>
<input
  type="range"
  id="densitySlider"
  min="0.05"
  max="0.80"
  step="0.05"
  value="0.30"
>
<label for="speedSlider">Speed:</label>
<input
  type="range"
  id="speedSlider"
  min="1"
  max="10"
  value="5"
>
<h2>Rules</h2>

<label for="birthRule">Birth (B):</label>
<input id="birthRule" type="text" value="3">

<label for="survivalRule">Survival (S):</label>
<input id="survivalRule" type="text" value="23">

<button id="applyRulesButton">Apply Rules</button>

<p>Current rule: <span id="ruleDisplay">B3/S23</span></p>
<h2>Rule-Space Experiment</h2>

<button id="sampleRulesButton">Sample 100 Rules</button>

<p id="experimentSummary">
  Click the button to test 100 random rules.
</p>

<pre id="experimentResults"></pre>
<br><br>
  <canvas id="grid" width="600" height="400"
        style="border: 1px solid black; background: white;">
</canvas>
<script src="script.js"></script>
</body>
</html>
